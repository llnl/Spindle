name: ci-slurm-plugin-artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  spindle-slurm-plugin-ubuntu:
    name: Testsuite (Slurm Plugin, Ubuntu)
    environment: Spindle CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Spindle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a
        with:
          version: latest

      - name: Login to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate MariaDB configuration
        id: slurm-ubuntu-mariadb
        run: |
          cd containers/spindle-slurm-ubuntu/testing-plugin
          ./generate_config.sh

      - name: Build spindle-slurm-plugin-ubuntu image
        id: slurm-ubuntu-build
        run: |
          cd containers/spindle-slurm-ubuntu/testing-plugin
          docker compose --progress=plain build

      - name: Bring spindle-slurm-plugin-ubuntu up
        id: slurm-ubuntu-up
        run: |
          cd containers/spindle-slurm-ubuntu/testing-plugin
          docker compose up -d --wait --wait-timeout 120

      - name: Verify munge works in spindle-slurm-plugin-ubuntu
        id: slurm-ubuntu-munge
        run: |
          docker exec slurm-plugin-head bash -c 'munge -n | unmunge'

      - name: Run spindle-slurm-plugin-ubuntu testsuite
        id: slurm-ubuntu-testsuite
        run: |
          docker exec slurm-plugin-head bash -c 'cd Spindle-build/testsuite && SPINDLE_DEBUG=3 salloc -n${workers} -N${workers} ./runTests ${workers}'

      - name: Run spindle-slurm-plugin-ubuntu session testsuite
        id: slurm-ubuntu-testsuite-sessions
        run: |
          docker exec slurm-plugin-head bash -c 'cd Spindle-build/testsuite && SPINDLE_DEBUG=3 salloc -n${workers} -N${workers} --spindle-session ./runTests ${workers}'

      - name: Collect Spindle logs from containers
        if: ${{ always() }}
        continue-on-error: true
        run: |
          failed=0
          for node in slurm-plugin-head slurm-plugin-node-1 slurm-plugin-node-2 slurm-plugin-node-3 slurm-plugin-node-4; do
            echo "::group::Collecting logs from $node"

            if ! workdir=$(docker inspect -f '{{.Config.WorkingDir}}' "$node" 2>/dev/null); then
              echo "Container $node not found; skipping."
              failed=1
              echo "::endgroup::"
              continue
            fi

            if [ -z "$workdir" ]; then
              echo "WorkingDir empty for $node; cannot resolve log path."
              failed=1
              echo "::endgroup::"
              continue
            fi

            src="$workdir/Spindle-build/testsuite"
            mkdir -p "spindle-logs/$node"

            if docker cp "$node:$src/." "spindle-logs/$node/"; then
              ls -la "spindle-logs/$node/"
            else
              echo "Copy failed for $node; listing container path:"
              docker exec "$node" ls -la "$src" || docker exec "$node" ls -la "$workdir" || true
              failed=1
              continue
            fi
            find "spindle-logs/$node/" -type f ! -name 'spindle_output.*' -delete

            echo "::endgroup::"
          done

          echo "Collected tree:"
          ls -R spindle-logs/ || true
          exit "$failed"

      - name: Upload Spindle logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: spindle-logs-slurm-plugin
          path: spindle-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Bring spindle-slurm-plugin-ubuntu down
        id: slurm-ubuntu-down
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd containers/spindle-slurm-ubuntu/testing-plugin
          docker compose down
